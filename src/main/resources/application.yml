spring:
  application:
    name: "job-tracker"
  datasource:
    driver-class-name: "com.mysql.cj.jdbc.Driver"
    url: "jdbc:mysql://localhost:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect: "org.hibernate.dialect.MySQLDialect"
flyway:
  enabled: true
  locations: classpath:/db/migration
  validateMigrationNaming: true
server:
  port: "8088"
springdoc:
  api-docs:
    path: "/api-docs.yaml"
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always